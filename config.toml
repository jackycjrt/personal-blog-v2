baseURL = "https://jackycjrt.github.io/personal-blog-v2/"
locale = "zh-CN"
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true
title = "Jack Bird"
theme = "anthropic-minimal"
enableRobotsTXT = true

[pagination]
  pagerSize = 6

[taxonomies]
  tag = "tags"
  category = "categories"

[params]
  author = "Jack Bird"
  brand = "Jack Bird"
  brandSubtitle = "Personal editorial archive"
  description = "一个以长期写作、项目记录和慢阅读体验为核心的个人博客。"
  defaultTheme = "auto"
  heroEyebrow = "Minimalist Blog Interface"
  heroTitle = "用更安静的前端，承载长期有效的内容。"
  heroSubtitle = "这里持续更新博客文章、项目记录与短笔记，围绕长期有效的内容进行整理、沉淀与表达。"
  heroButtonText = "进入文章归档"
  heroButtonLink = "/posts/"
  aboutHeroImage = "/images/about-hero.jpg"
  secondaryButtonText = "了解工作流"
  secondaryButtonLink = "/about/"
  footerNote = "Published with Hugo."
  github = "https://github.com/jackycjrt/personal-blog-v2"
  email = ""

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false

[[menu.main]]
  identifier = "home"
  name = "首页"
  pageRef = "/"
  weight = 10

[[menu.main]]
  identifier = "posts"
  name = "博客"
  pageRef = "/posts"
  weight = 20

[[menu.main]]
  identifier = "projects"
  name = "项目"
  pageRef = "/projects"
  weight = 30

[[menu.main]]
  identifier = "about"
  name = "关于"
  pageRef = "/about"
  weight = 40

[[menu.main]]
  identifier = "notes"
  name = "杂记"
  pageRef = "/notes"
  weight = 50
