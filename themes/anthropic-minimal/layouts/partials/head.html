<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#fdf8f8" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)" />
{{ $title := cond .IsHome .Site.Title (printf "%s | %s" .Title .Site.Title) }}
{{ $description := .Params.summary | default .Description | default .Site.Params.description }}
<title>{{ $title }}</title>
<meta name="description" content="{{ $description }}" />
<link rel="canonical" href="{{ .Permalink }}" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
{{ $css := resources.Get "css/main.css" | resources.Minify | resources.Fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}" />
<script>
  (function () {
    var configured = "{{ .Site.Params.defaultTheme | default "auto" }}";
    var stored = null;
    try {
      stored = localStorage.getItem("theme");
    } catch (error) {
      stored = null;
    }

    var theme = stored;
    if (theme !== "light" && theme !== "dark") {
      if (configured === "light" || configured === "dark") {
        theme = configured;
      } else {
        theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
    }

    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
