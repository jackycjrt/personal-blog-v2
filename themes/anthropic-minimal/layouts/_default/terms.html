{{ define "main" }}
  <section class="page-hero shell">
    <div class="page-hero-copy reveal">
      <p class="section-kicker">{{ .Data.Plural }}</p>
      <h1>{{ .Title }}</h1>
      <p class="page-intro">Browse the editorial index by term.</p>
    </div>
  </section>

  <section class="section shell">
    <div class="term-grid">
      {{ range .Data.Terms.Alphabetical }}
        <a class="term-card reveal" href="{{ .Page.RelPermalink }}">
          <strong>{{ .Page.Title }}</strong>
          <span>{{ .Count }} entries</span>
        </a>
      {{ else }}
        <div class="empty-card reveal">
          <p>No terms available yet.</p>
        </div>
      {{ end }}
    </div>
  </section>
{{ end }}
